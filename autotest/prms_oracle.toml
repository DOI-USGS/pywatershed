# Pinned pws-prms-oracle answer keys, generated by
#   python -m prms_oracle.oracle_key --toml
# from the oracle tree (a clone computes every platform's keys).
# The consumer downloads exactly these release assets:
#   inputs_<domain>_<ikey>.tar.gz
#   outputs_<domain>_<control>_<platform>_<okey>.tar.gz
# Outputs are keyed by control file stem; the comment names the
# directory the control writes. Bumping a key is a reviewed commit:
# the place where answer changes become visible.

