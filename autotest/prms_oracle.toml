# Pinned pws-prms-oracle answer keys. test_data/generate/oracle_fetch.py
# downloads exactly these release assets into test_data/.oracle/:
#   inputs_<domain>_<ikey>.tar.gz
#   outputs_<domain>_<control>_<platform>_<okey>.tar.gz
# Outputs are keyed by control file stem; the comment names the output
# directory the control writes. Answers differ by platform (snow
# knife-edges), so each control carries one okey per platform. Bumping
# a key is a reviewed commit: the place where answer changes become
# visible. Keys come from the release's manifest_<domain>.json (the
# keys CI published), e.g.
#   gh release download <domain> -R DOI-USGS/pws-prms-oracle \
#       --pattern manifest_<domain>.json -O -
# A local clone's `oracle_key --all` matches only at the published commit.

