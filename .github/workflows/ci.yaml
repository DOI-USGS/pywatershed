name: CI
on:
  # Pushes to any branch (here or on forks) run a skeleton: installs,
  # linting, and domainless tests. The full suite (the domain test jobs)
  # runs for pull requests, pushes to develop/main, and workflow_dispatch.
  # To ALSO run domain jobs on branch pushes, put a ci-<token> anywhere in
  # the branch name or in the pushed (head) commit message. Tokens:
  # ci-all, ci-sagehen, ci-hru1, ci-drb, ci-ucb, ci-fgr. For example, a
  # branch named my_feature_ci-fgr runs both fgr jobs on every push, with
  # no workflow edits to clean up before merging; a commit-message token
  # applies to its push only. Details in DEVELOPER.md under "CI".
  push:
    branches:
      - "*"
      - "!v[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
    branches:
      - "*"
      - "!v[0-9]+.[0-9]+.[0-9]+*"

  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: "Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)"
        required: false
        default: false

# Cancel in-flight runs superseded by a newer push on the same ref, but
# let every run on the mainline branches finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'develop' && github.ref_name != 'main' }}

jobs:
  pws_install:
    name: standard installation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Upgrade pip and install build and twine
        run: |
          python -m pip install --upgrade pip
          pip install wheel build twine importlib_metadata setuptools numpy

      - name: Standard installation
        run: |
          pip --verbose install .

      - name: Print pws version
        run: |
          python -c "import pywatershed; print(pywatershed.__version__)"

      - name: Build pywatershed, check dist outputs
        run: |
          python -m build
          twine check --strict dist/*

  pws_editable_install:
    name: editable installation
    runs-on: macos-latest
    strategy:
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Upgrade pip and install build and twine
        run: |
          python -m pip install --upgrade pip
          pip install wheel build twine importlib_metadata setuptools numpy

      - name: Editable installation
        run: |
          pip --verbose install -e .

      - name: Print pws version
        run: |
          python -c "import pywatershed; print(pywatershed.__version__)"

      - name: Build pywatershed, check dist outputs
        run: |
          python -m build
          twine check --strict dist/*

  pyws_lint:
    name: linting
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install wheel
          pip install .
          pip install ".[lint]"

      - name: Version info
        run: |
          pip -V
          pip list

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

  test_domainless:
    name: domainless ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.13"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      - name: Install Dependencies via Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          log-level: debug
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true
          create-args: >-
            python=${{matrix.python-version}}

      - name: Link conda gfortran dylibs on Mac
        if: runner.os == 'macOS'
        run: .github/scripts/symlink_gfortran_mac.sh

      - name: Set environment variables
        run: |
          echo "PYTHON_VERSION=${{ matrix.python-version }}" >> $GITHUB_ENV
          cat .mf6_ci_ref_remote  >> $GITHUB_ENV

      - name: Enforce MF6 ref and remote merge to main
        # need the code to update flopy but can get the binary
        # from nightly builds
        if: github.base_ref == 'main'
        run: |
          echo Merge commit: GITHUB_BASE_REF = $GITHUB_BASE_REF
          req_ref=develop  # if not develop, submit an issue
          echo $MF6_REF
          if [[ "$MF6_REF" != "$req_ref" ]]; then exit 1; fi
          req_remote=MODFLOW-USGS/modflow6
          echo $MF6_REMOTE
          if [[ "$MF6_REMOTE" != "$req_remote" ]]; then echo "bad mf6 remote in .mf6_ci_ref_remote"; exit 1; fi

      - name: Checkout MODFLOW 6
        uses: actions/checkout@v6
        with:
          repository: ${{ env.MF6_REMOTE }}
          ref: ${{ env.MF6_REF }}
          path: modflow6

      - name: Update flopy MODFLOW 6 classes
        working-directory: modflow6/autotest
        run: |
          # requires flopy[codegen] install option; --ref develop keeps
          # the generated classes in sync with the mf6 nightly binary
          # (flopy's bundled dfn snapshot lags mf6 develop)
          python -m flopy.mf6.utils.generate_classes --ref develop

      - name: Install mf6 nightly build binaries
        uses: modflowpy/install-modflow-action@v1
        with:
          repo: modflow6-nightly-build

      - name: Install pywatershed
        run: |
          pip install .

      - name: Version info
        run: |
          pip -V
          pip list

      - name: domainless - run tests not requiring domain data
        working-directory: autotest
        run: pytest
          -m domainless
          -n=auto
          -vv
          --durations=0
          --error-for-skips
          --cov=pywatershed
          --cov-report=xml
          --junitxml=pytest_domainless.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Test results for domainless-${{ runner.os }}-${{ matrix.python-version }}
          path: |
            ./autotest/pytest_domainless.xml

      - name: Upload code coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./autotest/coverage.xml
          env_vars: RUNNER_OS,PYTHON_VERSION
          fail_ci_if_error: false
          version: "v0.1.15"

  test_sagehen_5yr:
    name: sagehen_5yr ${{ matrix.os }} py${{ matrix.python-version }}
    # domain jobs skip plain branch pushes; see the ci-<token> note
    # in the trigger comment at the top of this file
    if: >-
      github.event_name != 'push' ||
      github.ref_name == 'develop' ||
      github.ref_name == 'main' ||
      contains(github.ref_name, 'ci-all') ||
      contains(github.event.head_commit.message, 'ci-all') ||
      contains(github.ref_name, 'ci-sagehen') ||
      contains(github.event.head_commit.message, 'ci-sagehen')
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.13"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      - name: Install Dependencies via Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          log-level: debug
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true
          create-args: >-
            python=${{matrix.python-version}}

      - name: Link conda gfortran dylibs on Mac
        if: runner.os == 'macOS'
        run: .github/scripts/symlink_gfortran_mac.sh

      - name: Install pywatershed
        run: |
          pip install .

      - name: Version info
        run: |
          pip -V
          pip list

      - name: Compile PRMS 5.2.1
        run: |
          which gfortran
          gfortran --version
          which make
          python -c "import pywatershed as pws; pws.utils.compile_prms('5.2.1')"

      - name: sagehen_5yr_no_cascades - generate and manage test data domain, run PRMS and convert csv output to NetCDF
        working-directory: autotest
        run: |
          python generate_test_data.py \
            --domain=sagehen_5yr \
            --control_pattern=sagehen_no_cascades.control \
            --remove_prms_csvs --remove_prms_output_dirs

      - name: sagehen_5yr_no_cascades - list netcdf input files
        working-directory: test_data
        run: |
          find sagehen_5yr/output_no_cascades -name '*.nc' | sort -n

      - name: sagehen_5yr_no_cascades - pywatershed tests
        working-directory: autotest
        run: pytest
          -vv
          -rs
          -n=auto
          -m "not domainless"
          --domain=sagehen_5yr
          --control_pattern=sagehen_no_cascades.control
          --durations=0
          --error-for-skips
          --cov=pywatershed
          --cov-report=xml
          --junitxml=pytest_sagehen_5yr_no_cascades.xml
          --ignore=test_cbh_to_netcdf.py
          --ignore=test_prms_dyn_params.py
          --ignore=test_control_read.py
          --ignore=test_domain_subset.py
          --ignore=test_mmr_to_mf6_dfw.py
          --ignore=test_model.py
          --ignore=test_netcdf_subset.py
          --ignore=test_nhm_restart.py
          --ignore=test_obsin_flow_node.py
          --ignore=test_output.py
          --ignore=test_pass_through_flow_graph.py
          --ignore=test_preprocess_cascades.py
          --ignore=test_prms_atmosphere_transp_frost.py
          --ignore=test_prms_atmosphere_transp_frost_dynamic.py
          --ignore=test_prms_channel.py
          --ignore=test_prms_channel_flow_graph.py
          --ignore=test_prms_et.py
          --ignore=test_prms_et_can_runoff.py
          --ignore=test_prms_et_canopy.py
          --ignore=test_prms_hydraulic_geometry.py
          --ignore=test_prms_runoff.py
          --ignore=test_prms_runoff_ag.py
          --ignore=test_prms_runoff_ag_restart.py
          --ignore=test_prms_runoff_soilzone_ag.py
          --ignore=test_prms_soilzone_ag.py
          --ignore=test_prms_soilzone_ag_restart.py
          --ignore=test_prms_stream_temp.py
          --ignore=test_source_sink_flow_node.py
          --ignore=test_starfit_flow_graph.py

      - name: sagehen_5yr_no_gw_cascades - generate and manage test data domain, run PRMS and convert csv output to NetCDF
        working-directory: autotest
        run: |
          python generate_test_data.py \
            --domain=sagehen_5yr \
            --control_pattern=sagehen_no_gw_cascades.control \
            --remove_prms_csvs --remove_prms_output_dirs

      - name: sagehen_5yr_no_gw_cascades - list netcdf input files
        working-directory: test_data
        run: |
          find sagehen_5yr/output_no_gw_cascades -name '*.nc' | sort -n

      - name: sagehen_5yr_no_gw_cascades - pywatershed tests
        working-directory: autotest
        run: pytest
