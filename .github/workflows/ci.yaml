    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.13"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      - name: Install Dependencies via Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          log-level: debug
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true
          create-args: >-
            python=${{matrix.python-version}}

      - name: Link conda gfortran dylibs on Mac
        if: runner.os == 'macOS'
        run: .github/scripts/symlink_gfortran_mac.sh

      - name: Install pywatershed
        run: |
          pip install .

      - name: Version info
        run: |
          pip -V
          pip list

      - name: Get additional domain files for tests
        run: |
          python pywatershed/utils/addtl_domain_files.py
          if [ $? -ne 0 ]; then
            echo "Failed to download additional domain files"
            exit 1
          fi
          echo ""
          echo "Checking where additional domains were downloaded:"
          python -c "
          import pywatershed as pws
          pkg_root = pws.constants.__pywatershed_root__
          addtl_dir = pkg_root / 'data' / 'pywatershed_addtl_domains'
          print(f'Package root: {pkg_root}')
          print(f'Additional domains dir: {addtl_dir}')
          print(f'Additional domains exists: {addtl_dir.exists()}')
          if addtl_dir.exists():
              import os
              print(f'Contents: {os.listdir(addtl_dir)}')
          "

      - name: Create symlink to fgr_ag_2yr domain
        run: |
          echo "Current directory: $(pwd)"
          echo ""
          python -c "
          import os
          import sys
          import platform
          import shutil
          # Remove current directory from sys.path to avoid importing local source
          # We want the installed package in site-packages, not repo source
          if '' in sys.path:
              sys.path.remove('')
          if '.' in sys.path:
              sys.path.remove('.')
          cwd = os.getcwd()
          if cwd in sys.path:
              sys.path.remove(cwd)
          # Now import pywatershed from site-packages
          import pywatershed as pws
          # Find pywatershed package location using __file__
          pkg_dir = os.path.dirname(pws.__file__)
          src = os.path.join(pkg_dir, 'data', 'pywatershed_addtl_domains', 'fgr_ag_2yr')
          dst = 'test_data/fgr_ag_2yr'
          print(f'Platform: {platform.system()}')
          print(f'Package directory: {pkg_dir}')
          print(f'Source path: {src}')
          print(f'Source exists: {os.path.exists(src)}')
          print(f'Destination path: {dst}')
          print(f'Destination absolute: {os.path.abspath(dst)}')
          if not os.path.exists(src):
              print(f'ERROR: Source path does not exist!')
              print(f'Checking pywatershed/data:')
              data_dir = os.path.join(pkg_dir, 'data')
              if os.path.exists(data_dir):
                  print(f'Contents: {os.listdir(data_dir)}')
              sys.exit(1)
          if os.path.exists(dst):
              print(f'Removing existing destination')
              if os.path.islink(dst) or os.path.isfile(dst):
                  os.unlink(dst)
              else:
                  shutil.rmtree(dst)
          # On Windows, copy instead of symlink (symlinks require special privileges)
          if platform.system() == 'Windows':
              print(f'Copying directory (Windows)')
              shutil.copytree(src, dst)
          else:
              print(f'Creating symlink (Unix)')
              os.symlink(src, dst, target_is_directory=True)
          print(f'Link/copy created successfully')
          print(f'Destination exists (after): {os.path.exists(dst)}')
          "

      - name: fgr_ag_2yr_subset2 all configs - generate and manage test data
        working-directory: autotest
        run: |
          python generate_test_data.py \
            -n=auto \
            --domain=fgr_ag_2yr \
            --remove_prms_csvs \
            --remove_prms_output_dirs \
            --control_pattern=spinup.control \
            --control_pattern=analysis.control

      - name: fgr_ag_2yr_subset2 - list netcdf input files
        working-directory: test_data
        run: |
          find fgr_ag_2yr/output_spinup -name '*.nc' | sort -n
          find fgr_ag_2yr/output_analysis -name '*.nc' | sort -n

      - name: fgr_ag_2yr_subset2 - pywatershed tests
        working-directory: autotest
        run: pytest
          -vv
          -rs
          -n=auto
          --domain=fgr_ag_2yr
          --control_pattern=spinup.control
          --control_pattern=analysis.control
          --durations=0
          --error-for-skips
          --cov=pywatershed
          --cov-report=xml
          --junitxml=pytest_fgr_ag_2yr_subset2.xml
          test_prms_runoff_soilzone_ag.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Test results for fgr_ag_2yr_subset2-${{ runner.os }}-${{ matrix.python-version }}
          path: |
            ./autotest/pytest_fgr_ag_2yr_subset2.xml

      - name: Upload code coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./autotest/coverage.xml
          env_vars: RUNNER_OS,PYTHON_VERSION
          fail_ci_if_error: false
          version: "v0.1.15"
