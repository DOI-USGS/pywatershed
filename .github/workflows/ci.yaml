        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.13"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      - name: Set environment variables
        run: |
          echo "PYTHON_VERSION=${{ matrix.python-version }}" >> $GITHUB_ENV
          cat .mf6_ci_ref_remote  >> $GITHUB_ENV

      - name: Install Dependencies via Micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          log-level: debug
          environment-file: environment.yml
          cache-environment: true
          cache-downloads: true
          create-args: >-
            python=${{matrix.python-version}}

      - name: Link conda gfortran dylibs on Mac
        if: runner.os == 'macOS'
        run: .github/scripts/symlink_gfortran_mac.sh

      - name: Enforce MF6 ref and remote merge to main
        # need the code to update flopy but can get the binary
        # from nightly builds
        if: github.base_ref == 'main'
        run: |
          echo Merge commit: GITHUB_BASE_REF = $GITHUB_BASE_REF
          req_ref=develop  # if not develop, submit an issue
          echo $MF6_REF
          if [[ "$MF6_REF" != "$req_ref" ]]; then exit 1; fi
          req_remote=MODFLOW-USGS/modflow6
          echo $MF6_REMOTE
          if [[ "$MF6_REMOTE" != "$req_remote" ]]; then echo "bad mf6 remote in .mf6_ci_ref_remote"; exit 1; fi

      - name: Checkout MODFLOW 6
        uses: actions/checkout@v6
        with:
          repository: ${{ env.MF6_REMOTE }}
          ref: ${{ env.MF6_REF }}
          path: modflow6

      - name: Update flopy MODFLOW 6 classes
        working-directory: modflow6/autotest
        run: |
          # requires flopy[codegen] install option; --ref develop keeps
          # the generated classes in sync with the mf6 nightly binary
          # (flopy's bundled dfn snapshot lags mf6 develop)
          python -m flopy.mf6.utils.generate_classes --ref develop

      - name: Install mf6 nightly build binaries
        uses: modflowpy/install-modflow-action@v1
        with:
          repo: modflow6-nightly-build

      - name: Install pywatershed
        run: |
          pip install .

      - name: Version info
        run: |
          pip -V
          pip list

      - name: Get GIS files for tests
        run: |
          python pywatershed/utils/gis_files.py

      - name: Compile PRMS 5.2.1 and 5.2.1.1
        run: |
          which gfortran
          gfortran --version
          which make
          python -c "import pywatershed as pws; pws.utils.compile_prms('5.2.1')"
          python -c "import pywatershed as pws; pws.utils.compile_prms('5.2.1.1')"

      - name: drb_2yr all domains - generate and manage test data
        working-directory: autotest
        run: |
          python generate_test_data.py \
            -n=auto --domain=drb_2yr \
            --remove_prms_csvs --remove_prms_output_dirs

      - name: drb_2yr all domains - list netcdf input files
        working-directory: test_data
        run: |
          find drb_2yr/output*/ -name '*.nc' | sort -n

      - name: drb_2yr_nhm - pywatershed tests
        working-directory: autotest
        run: pytest
          -vv
          -rs
          -n=auto
          -m "not domainless"
          --domain=drb_2yr
          --control_pattern=nhm.control
          --durations=0
          --error-for-skips
          --cov=pywatershed
          --cov-report=xml
          --junitxml=pytest_drb_2yr_nhm.xml
          --ignore=test_obsin_flow_node.py
          --ignore=test_preprocess_cascades.py
          --ignore=test_prms_dyn_params.py
          --ignore=test_prms_atmosphere_transp_frost.py
          --ignore=test_prms_atmosphere_transp_frost_dynamic.py
          --ignore=test_prms_hydraulic_geometry.py
          --ignore=test_prms_stream_temp.py
          --ignore=test_domain_subset.py
          --ignore=test_prms_runoff_ag.py
          --ignore=test_prms_runoff_ag_restart.py
          --ignore=test_prms_runoff_soilzone_ag.py
          --ignore=test_prms_soilzone_ag.py
          --ignore=test_prms_soilzone_ag_restart.py
          --ignore=test_source_sink_flow_node.py
          --ignore=test_starfit_flow_graph.py

      # Specific tests not redundant with dprst
      - name: drb_2yr_no_dprst - pywatershed tests
        working-directory: autotest
        run: pytest
          -vv
          -rs
          -n=auto
          -m "not domainless"
          --domain=drb_2yr
          --control_pattern=no_dprst
          --durations=0
          --error-for-skips
          --cov=pywatershed
          --cov-report=xml
          --junitxml=pytest_drb_2yr_no_dprst.xml
          test_prms_runoff.py
          test_prms_soilzone.py
          test_prms_groundwater.py
          test_prms_above_snow.py
          test_prms_below_snow.py

      # Specific tests not redundant with dprst
      - name: drb_2yr_obsin - pywatershed tests
        working-directory: autotest
        run: pytest
          -vv
          -rs
          -n=0
          -m "not domainless"
          --domain=drb_2yr
          --control_pattern=nhm_obsin.control
          --durations=0
          --error-for-skips
          --cov=pywatershed
          --cov-report=xml
          --junitxml=pytest_drb_2yr_obsin.xml
          test_obsin_flow_node.py

      # Specific tests not redundant with dprst
      - name: drb_2yr_nhm_transp_frost - pywatershed tests
        working-directory: autotest
        run: pytest
          -vv
          -rs
          -n=auto
          -m "not domainless"
          --domain=drb_2yr
          --control_pattern=nhm_transp_frost.control
          --durations=0
          --error-for-skips
          --cov=pywatershed
          --cov-report=xml
          --junitxml=pytest_drb_2yr_transp_frost.xml
          test_prms_atmosphere_transp_frost.py

      # Specific tests not redundant with dprst
      - name: drb_2yr_stream_temp - pywatershed tests
        working-directory: autotest
        run: pytest
          -vv
          -rs
          -n=auto
          -m "not domainless"
          --domain=drb_2yr
          --control_pattern=nhm_stream_temp
          --durations=0
          --error-for-skips
          --cov=pywatershed
          --cov-report=xml
          --junitxml=pytest_drb_2yr_stream_temp.xml
          test_prms_hydraulic_geometry.py
          test_prms_stream_temp.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Test results for drb_2yr-${{ runner.os }}-${{ matrix.python-version }}
          path: |
            ./autotest/pytest_drb_2yr_nhm.xml
            ./autotest/pytest_drb_2yr_no_dprst.xml
            ./autotest/pytest_drb_2yr_obsin.xml
            ./autotest/pytest_drb_2yr_transp_frost.xml
            ./autotest/pytest_drb_2yr_stream_temp.xml

      - name: Upload code coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./autotest/coverage.xml
          env_vars: RUNNER_OS,PYTHON_VERSION
          fail_ci_if_error: false
          version: "v0.1.15"

