name: CI example notebooks

on:
  # Pushes to any branch (here or on forks) run the notebooks on ubuntu
  # only; all platforms run for pull requests and develop/main pushes.
  # See DEVELOPER.md under "CI" for the skeleton/full CI strategy.
  push:
    branches:
      - "*"
      - "!v[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
    branches:
      - "*"
      - "!v[0-9]+.[0-9]+.[0-9]+*"

# Cancel in-flight runs superseded by a newer push on the same ref, but
# let every run on the mainline branches finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'develop' && github.ref_name != 'main' }}

jobs:
  test:
    name: ${{ matrix.os}} py${{ matrix.python-version }}

    runs-on: ${{ matrix.os }}

    env:
      # Force UTF-8 encoding on Windows to avoid cp1252 encoding issues
      PYTHONUTF8: ${{ matrix.os == 'windows-latest' && '1' || '' }}

    defaults:
      run:
        shell: bash -l {0}

    strategy:
      fail-fast: false
      matrix:
        # skeleton/full split: all platforms for pull requests and
        # develop/main pushes; ubuntu only for other pushes
        os: ${{ (github.event_name != 'push' || github.ref_name == 'develop' || github.ref_name == 'main') && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
        python-version: ["3.13"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment_w_jupyter.yml
          cache-environment: true
          cache-downloads: true
          create-args: >-
            python=${{matrix.python-version}}

      - name: Install error reporter
        run: |
          pip install pytest-github-actions-annotate-failures

      - name: Install dependencies and this package (test non-editable on windows)
        run: |
          ${{ matrix.os == 'windows-latest' && 'pip install .' || 'pip install -e .' }}

      - name: Version info
        run: |
          pip -V
          pip list

      - name: Import pywatershed
        run: |
          python -c "import pywatershed"

      - name: Get GIS files for tests
        run: |
          python pywatershed/utils/gis_files.py

      - name: Get additional domain files for notebooks
        run: |
          python pywatershed/utils/addtl_domain_files.py

      - name: Cache the oracle answer set
        uses: actions/cache@v4
        with:
          path: test_data/.oracle
          key: oracle-notebooks-${{ runner.os }}-${{ hashFiles('autotest/prms_oracle.toml') }}

      - name: Fetch the oracle answer sets the notebooks read and populate test_data
        working-directory: autotest
        env:
          GITHUB_TOKEN: ${{ secrets.PWS_ORACLE_TOKEN }}
        run: |
          python ../test_data/generate/oracle_fetch.py --domain=drb_2yr --domain=ucb_2yr --domain=sagehen_5yr
          python ../test_data/generate/oracle_populate.py --domain=drb_2yr
          python ../test_data/generate/oracle_populate.py --domain=ucb_2yr
          python ../test_data/generate/oracle_populate.py --domain=sagehen_5yr

      - name: Run tests
        working-directory: autotest_exs
        run: |
          pytest -s -vv  --durations=0
